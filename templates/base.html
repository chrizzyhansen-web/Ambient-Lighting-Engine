<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Ambient Engine{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #121218;
    --panel: #1a1a22;
    --panel-line: #2b2b35;
    --text: #ECE9E2;
    --text-muted: #8b8a95;
    --accent: #7C83FD;
    --light: {{ light_color|default('#E8935B') }};
    --ok: #6FCF97;
    --err: #E37B7B;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 15px;
    line-height: 1.55;
  }
  h1, h2, h3 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    letter-spacing: -0.01em;
    margin: 0 0 0.4em 0;
  }
  a { color: var(--accent); }
  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 56px 24px 80px;
  }
  .eyebrow {
    color: var(--text-muted);
    font-size: 13px;
    margin-bottom: 10px;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--panel-line);
    padding: 28px;
    margin-top: 28px;
  }
  .field {
    margin-bottom: 18px;
  }
  .field label {
    display: block;
    color: var(--text-muted);
    font-size: 13px;
    margin-bottom: 6px;
  }
  .field input {
    width: 100%;
    background: #0F0F14;
    border: 1px solid var(--panel-line);
    color: var(--text);
    padding: 10px 12px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
  }
  .field input:focus {
    outline: none;
    border-color: var(--accent);
  }
  .field .hint {
    color: var(--text-muted);
    font-size: 12.5px;
    margin-top: 6px;
  }
  .row { display: flex; gap: 12px; align-items: center; }
  .row > * { flex: 1; }
  button, .btn {
    display: inline-block;
    background: var(--accent);
    color: #0F0F14;
    border: none;
    padding: 11px 18px;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 500;
    font-size: 14px;
    cursor: pointer;
    text-decoration: none;
  }
  button:hover, .btn:hover { opacity: 0.88; }
  button.secondary, .btn.secondary {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--panel-line);
  }
  button.stop, .btn.stop {
    background: var(--err);
    color: #0F0F14;
  }
  .status-dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    margin-right: 8px;
    background: var(--text-muted);
  }
  .status-dot.ok { background: var(--ok); }
  .divider {
    border: none;
    border-top: 1px solid var(--panel-line);
    margin: 32px 0;
  }
  .service-group {
    margin-bottom: 32px;
  }
  .service-group h3 {
    display: flex;
    align-items: center;
    font-size: 17px;
  }
  nav.topnav {
    display: flex;
    gap: 20px;
    margin-top: 2px;
  }
  nav.topnav a {
    color: var(--text-muted);
    text-decoration: none;
    font-size: 13px;
    padding-bottom: 4px;
    border-bottom: 2px solid transparent;
  }
  nav.topnav a.active {
    color: var(--text);
    border-bottom-color: var(--accent);
  }
  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 24px;
  }
  .tabs button {
    background: transparent;
    color: var(--text-muted);
    border: 1px solid var(--panel-line);
    padding: 8px 16px;
    font-size: 13px;
  }
  .tabs button.active {
    background: var(--accent);
    color: #0F0F14;
    border-color: var(--accent);
  }
  .step {
    margin-bottom: 22px;
    padding-left: 18px;
    border-left: 2px solid var(--panel-line);
  }
  .step h4 {
    margin: 0 0 6px 0;
    font-size: 14.5px;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 500;
    color: var(--text);
  }
  .step p {
    margin: 0;
    color: var(--text-muted);
    font-size: 13.5px;
  }
  code {
    background: #0F0F14;
    border: 1px solid var(--panel-line);
    padding: 1px 6px;
    font-size: 0.92em;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">ambient lighting engine</div>
  <nav class="topnav">
    <a href="/" class="{{ 'active' if active_page == 'dashboard' else '' }}">Dashboard</a>
    <a href="/setup" class="{{ 'active' if active_page == 'setup' else '' }}">Setup</a>
    <a href="/help" class="{{ 'active' if active_page == 'help' else '' }}">Help</a>
  </nav>
  {% block content %}{% endblock %}
</div>
</body>
</html>
